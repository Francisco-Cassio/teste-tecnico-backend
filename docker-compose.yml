version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: db_consultas
    environment:
      - POSTGRES_DB=clinica_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinica_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: api_consultas
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-chave-temporaria-docker-compose-dev
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DB_NAME=clinica_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: